# Automatic report delivery: every 10 minutes, asks the live site to deliver purchased-service reports whose
# 3-hour mark has passed without admin approval (English + Hindi PDF in the client's report area, then SMS + email).
# Setup (once): GitHub → repo → Settings → Secrets and variables → Actions → New repository secret
#   SITE_URL     = https://www.mynumerologist.com
#   CRON_SECRET  = the same value as CRON_SECRET in Vercel → Project → Settings → Environment Variables
name: Deliver due reports
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the delivery endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="${SITE_URL:-https://www.mynumerologist.com}"
          curl --fail-with-body -sS --max-time 320 -H "Authorization: Bearer ${CRON_SECRET}" "${url%/}/api/cron/deliver-reports"
